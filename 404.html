<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel not found</title>
    <style>
      :root { --bg: #f5f6fa; --text: #1c2233; --muted: #667085; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d111c; --text: #e7eaf2; --muted: #98a1b5; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
             background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 440px; text-align: center; }
      p { color: var(--muted); }
      button { padding: 8px 16px; border: 0; border-radius: 6px; background: #0f1b3d; color: #fff;
               font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Channel not found</h1>
      <p id="message"></p>
      <button id="reset" type="button">Go to the default channel</button>
    </main>
    <script>
      // GitHub Pages serves this page for any missing path. A project site lives under
      // /<repo>/, so the first path segment is the site root and the second the channel.
      var segments = location.pathname.split('/');
      var root = '/' + segments[1] + '/';
      var channel = segments[2] || '';
      document.getElementById('message').textContent =
        channel === 'development'
          ? 'The default channel is not deployed yet. Push to main to deploy it.'
          : 'Nothing is deployed at "' + channel + '". The channel may have been deleted.';
      document.getElementById('reset').onclick = function () {
        document.cookie = 'channel=; Path=' + root + '; Max-Age=0; SameSite=Lax; Secure';
        location.href = root;
      };
    </script>
  </body>
</html>
